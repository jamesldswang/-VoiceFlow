<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="redGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="24" y="24" width="464" height="464" rx="96" fill="none" stroke="#27272a" stroke-width="4"/>
  
  <!-- Outer glowing recording ring -->
  <circle cx="256" cy="256" r="148" fill="none" stroke="#ef4444" stroke-opacity="0.2" stroke-width="8"/>
  <circle cx="256" cy="256" r="126" fill="none" stroke="#ef4444" stroke-opacity="0.4" stroke-width="4" stroke-dasharray="8 8"/>
  
  <!-- Central Microphone Body -->
  <rect x="220" y="160" width="72" height="130" rx="36" fill="url(#redGlow)" filter="url(#glow)"/>
  <path d="M184 250 C184 290 216 322 256 322 C296 322 328 290 328 250" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round"/>
  <line x1="256" y1="322" x2="256" y2="370" stroke="#ffffff" stroke-width="18" stroke-linecap="round"/>
  <line x1="216" y1="370" x2="296" y2="370" stroke="#ffffff" stroke-width="18" stroke-linecap="round"/>
  
  <!-- Pulsing Sound Waves -->
  <path d="M142 220 C130 238 130 274 142 292" fill="none" stroke="#ef4444" stroke-width="12" stroke-linecap="round"/>
  <path d="M370 220 C382 238 382 274 370 292" fill="none" stroke="#ef4444" stroke-width="12" stroke-linecap="round"/>
  <path d="M106 200 C88 230 88 282 106 312" fill="none" stroke="#ef4444" stroke-opacity="0.6" stroke-width="10" stroke-linecap="round"/>
  <path d="M406 200 C424 230 424 282 406 312" fill="none" stroke="#ef4444" stroke-opacity="0.6" stroke-width="10" stroke-linecap="round"/>
</svg>
